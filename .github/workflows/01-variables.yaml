name: 01-variables
run-name: variables scope in workflow
on: 
  workflow_dispatch
env:
  cloud: google-cloud
jobs:
  gretting_job:
    runs-on: ubuntu-latest
    env: 
      greeting: hello
    steps:
      - name: "say hello from the cloud"
        run: echo "$greeting $first_name is using $cloud"
        env:
          first_name: Ishan 